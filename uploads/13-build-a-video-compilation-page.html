<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Video Compilation Page</title>
</head>

<body> <!-- sets the body of the document -->
<main> <!-- sets the main content area -->
<h1>Guerz's fCC video compilation</h1> <!-- main heading -->
<p>welcome to Guerz's page! enjoy the videos! ^_^</p> <!-- paragraph element provides a brief introduction to the page -->
<section> <!-- section element groups related content together -->
    <h2>first compilation</h2> <!-- heading for the first section -->
    <p>this is the first paragraph.</p>
    <iframe
      src="first-compilation.mp4"
      title="guerz's first"
      height="315"
      width="560">
    </iframe> <!-- iframe element embeds a video file into the page. src attribute specifies the path to the video file. title attribute provides a descriptive title for the iframe content. height and width attributes set the dimensions of the iframe. -->
</section>

</section>

</body>

</html>
