<!DOCTYPE html> <!-- tells browsers that the document uses HTML5 -->
<html lang="en"> <!-- html element defines the root of an HTML document. lang attribute sets the language. en value sets language to English -->
<head> <!-- contains metadata about the document, such as its title and character encoding -->
  <meta charset="UTF-8"> <!-- meta element specifies the character encoding for the HTML document. charset attribute is the character encoding. UTF-8 value is the standard encoding and can encode mostly all characters, symbols, and emoji -->
  <title>Travel Agency Page</title> <!-- determines what browsers show in the title bar or tab for the page -->
</head>
<body> <!-- contains the visible webpage content that users see and interact with -->
  <header> <!-- contains introductory content, typically a group of introductory or navigational aids -->
    <h1>Wanderlust Travel Agency</h1> <!-- main heading of the webpage -->
    <p>Discover breathtaking destinations around the globe and let us help you plan the trip of a lifetime.</p>  <!-- contains a paragraph of text -->
  </header>
<main> <!-- contains the main content of the document. there should be only one main element per document -->
  <h2>Packages</h2> <!-- represents a subheading of the webpage -->
  <p>We offer a variety of travel packages tailored to fit every type of traveler and budget.</p>
  <ul> <!-- creates an unordered list of items -->
    <li><a href="https://www.freecodecamp.org/learn" target="_blank">Group Travels</a></li> <!-- li element represents a list item. a element creates a hyperlink. href attribute specifies the URL of the page the link goes to. target="_blank" opens the link in a new tab or window -->
    <li><a href="https://www.freecodecamp.org/learn" target="_blank">Private Tours</a></li>
  </ul>
  <h2>Top Itineraries</h2>
  <figure> <!-- represents self-contained content, often with a caption -->
    <a href="https://www.freecodecamp.org/learn" target="_blank">
      <img src="https://cdn.freecodecamp.org/curriculum/labs/colosseo.jpg" alt="The Colosseum in Rome, Italy"> <!-- img element embeds an image into the document. src attribute specifies the path to the image. alt attribute provides alternative text for the image if it cannot be displayed -->
    </a>
    <figcaption>Explore the ancient wonders of Rome, Italy.</figcaption> <!-- provides a caption or legend for the content of the figure -->
  </figure>
  <figure>
    <a href="https://www.freecodecamp.org/learn" target="_blank">
      <img src="https://cdn.freecodecamp.org/curriculum/labs/alps.jpg" alt="Snow-capped peaks of the Alps">
    </a>
    <figcaption>Hike through the stunning peaks of the Alps.</figcaption>
  </figure>
  <figure>
    <a href="https://www.freecodecamp.org/learn" target="_blank">
      <img src="https://cdn.freecodecamp.org/curriculum/labs/sea.jpg" alt="Crystal clear sea and coastline">
    </a>
    <figcaption>Relax on the shores of a crystal-clear sea.</figcaption>
  </figure>
</main>
</body>
</html>
