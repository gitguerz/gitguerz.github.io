<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display Videos in an iframe</title>
  </head>
  <body>
    <h1>iframe Video Display</h1>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/I0_951_MPE0"
      allow="accelerometer autoplay clipboard-write encrypted-media gyroscope web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    >
    </iframe> <!-- iframe element embeds a video file into the page. width and height attributes set the dimensions of the iframe. src attribute specifies the path to the video file. allow attribute specifies which features are allowed for the iframe content. referrerpolicy attribute controls how much referrer information is sent with requests made from the iframe. allowfullscreen attribute allows the iframe content to be displayed in fullscreen mode. -->
  </body>
</html>
