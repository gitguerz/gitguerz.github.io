<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hotel Feedback Form</title>
  </head>
  <body>
    <header>
      <h1>Hotel Feedback Form</h1>
      <p>
        Thank you for staying with us. Please provide feedback on your recent
        stay.
      </p>
    </header>
    <main>
      <form method="POST" action="https://hotel-feedback.freecodecamp.org">
        <fieldset> <!-- fieldset defines a group of related form elements -->
          <legend>Personal Information</legend> <!-- legend defines a caption for the fieldset -->
          <label for="full-name">Name (required):</label> <!-- label provides a text description for the input field -->
          <input type="text" id="full-name" name="name" placeholder="e.g., John Doe" required size="20"> <!-- input defines a field where the user can enter data. name attribute adds a name to the input field. placeholder attribute defines a hint about what to enter. required attribute makes the field mandatory. size attribute sets the width of the input field -->


          <label for="email">Email address (required):</label>
          <input
            placeholder="example@email.com"
            required
            id="email"
            type="email"
            name="email"
            size="20"
          />
          <label for="age">Age (optional):</label>
          <input type="number" name="age" id="age" min="3" max="100" /> <!--min and max attributes set the range of values for the input field -->
        </fieldset>

        <fieldset>
          <legend>Was this your first time at our hotel?</legend>
          <input id="yes-option" type="radio" name="hotel-stay" value="yes" /> <!-- radio value used when you want users to select one option from a list of options. in this example, the radio buttons are grouped together by using the same name attribute value. This means that only one radio button can be selected at a time. value attribute sets the value of the radio button. -->
          <label for="yes-option">Yes</label>
          <input id="no-option" type="radio" name="hotel-stay" value="no" />
          <label for="no-option">No</label>
        </fieldset>

        <fieldset>
          <legend>
            Why did you choose to stay at our hotel? (Check all that apply)
          </legend>

          <input type="checkbox" id="ads" name="choice" value="ads" /> <!-- checkbox defines a checkable box -->
          <label for="ads">Social Media Ads</label>

          <input
            type="checkbox"
            id="recommendation"
            name="choice"
            value="recommendation"
          />
          <label for="recommendation">Personal Recommendation</label>
          
          <input type="checkbox" id="location" name="choice" value="location" />
          <label for="location">Location</label>

          <input
            checked
            type="checkbox"
            id="reputation"
            name="choice"
            value="reputation"
          /> <!-- checked attribute pre-selects a checkbox -->
          <label for="reputation">Reputation</label>
          
          <input type="checkbox" id="price" name="choice" value="price" />
          <label for="price">Price</label>
        </fieldset>

        <fieldset>
          <legend>Ratings</legend>

          <label for="service">How was the service?</label>

          <select name="service" id="service"> <!-- select defines a drop-down list -->
            <option value="poor">Poor</option> <!-- option defines an option in a drop-down list. value attribute sets the value of the option -->
            <option value="satisfactory">Satisfactory</option>
            <option value="good">Good</option>
            <option value="very-good">Very Good</option>
            <option selected value="excellent">Excellent</option>
          </select>

          <label for="food">How was the food?</label>

          <select name="food" id="food">
            <option value="poor">Poor</option>
            <option value="satisfactory">Satisfactory</option>
            <option value="good">Good</option>
            <option value="very-good">Very Good</option>
            <option selected value="excellent">Excellent</option> <!-- selected attribute pre-selects an option -->
          </select>
        </fieldset>

        <label for="comments">Other Comments?</label>
        <textarea cols="30" rows="10" name="comments" id="comments"></textarea> <!-- textarea defines a multi-line text input field. cols and rows attributes set the dimensions of the text area -->

        <button type="submit">Submit</button>        
      </form>
    </main>
  </body>
</html>
