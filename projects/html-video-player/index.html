<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Working with the HTML Video Element</title>
</head>
<body>
  <h1>Working with the HTML Video Element</h1>
  <video 
    width="640"
    loop
    controls
    muted
    poster="https://cdn.freecodecamp.org/curriculum/labs/past-event2.jpg"
  > <!-- video is a replaced element that adds a video player to your webpage. width attribute sets the width of the video player. loop attribute makes the video play in a loop. controls attribute adds play, pause, and volume controls. muted attribute mutes the audio. poster attribute sets the image that will be displayed before the video starts playing. -->
    <source
      src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4"
      type="video/mp4"
    > <!-- source element specifies the video file and its format. type attribute specifies the format of the video file. video/mp4 value is the format for MP4 videos. -->
    <source
      src="https://cdn.freecodecamp.org/curriculum/labs/mapmethod.webm"
      type="video/webm"
    > <!-- video/webm value is the format for WebM videos. -->
    <source
      src="https://cdn.freecodecamp.org/curriculum/labs/mapmethod.ogg"
      type="video/ogg"
    > <!-- video/ogg value is the format for OGG videos. -->
    <source
      src="https://cdn.freecodecamp.org/curriculum/labs/mapmethod.mov"
      type="video/quicktime"
    > <!-- video/quicktime value is the format for QuickTime videos. -->
  </video>
</body>
</html>
