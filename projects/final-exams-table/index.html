<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Calculus Final Exams Table</title>
    <meta charset="UTF-8" />
  </head>
  <body>
    <table>
      <caption> <!-- caption element defines a caption for the table -->
        Calculus Final Exam Grades
      </caption>

      <thead> <!--thead element defines a set of rows that define the column headers of the table -->
        <tr> <!-- tr element defines a row of cells in the table -->
          <th>Last Name</th> <!-- th element defines a header cell in the table -->
          <th>First Name</th>
          <th>Grade</th>
        </tr>
      </thead>

      <tbody> <!-- tbody element defines a set of rows that define the main content of the table -->
        <tr>
          <td>Davis</td>
          <td>Alex</td>
          <td>54</td>
        </tr>

        <tr>
          <td>Doe</td>
          <td>Samantha</td>
          <td>92</td>
        </tr>

        <tr>
          <td>Rodriguez</td>
          <td>Marcus</td>
          <td>88</td>
        </tr>

        <tr>
          <td>Thompson</td>
          <td>Jane</td>
          <td>77</td>
        </tr>

        <tr>
          <td>Williams</td>
          <td>Natalie</td>
          <td>83</td>
        </tr>
      </tbody>

      <tfoot> <!-- tfoot defines a set of rows that define the footer of the table -->
        <tr>
          <td colspan="2">Average Grade</td> <!--colspan attribute defines the number of columns a cell should span -->
          <td>78.8</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
