<!DOCTYPE html> <!-- tells browsers that the document is an HTML5 document-->
<html lang="en"> <!-- html element defines the root of an HTML document. lang attribute sets the language. en value sets language to English -->
<head> <!-- element contains meta information about the webpage -->
  <meta charset="UTF-8"> <!-- meta element specifies the character encoding for the HTML document. charset attribute is the character encoding. UTF-8 value is the standard encoding and can encode mostly all characters, symbols, and emoji -->
  <title>CatPhotoApp</title> <!-- determines what browsers show in the title bar or tab for the page -->
</head>
  <body>
    <main> <!-- identifies the main section of webpage -->
      <h1>CatPhotoApp</h1> <!-- main title of webpage -->
      <section> <!-- defines a section of the webpage -->
        <h2>Cat Photos</h2> <!-- second-level heading (subtitle of webpage) -->
        <p>Everyone loves <a href="https://cdn.freecodecamp.org/curriculum/cat-photo-app/running-cats.jpg">cute cats</a> online!</p>
        <p>See more <a target="_blank" href="https://freecatphotoapp.com">cat photos</a> in our gallery.</p> <!-- anchor element adds a link to cat photos website. _blank opens link in new tab -->
        <a href="https://freecatphotoapp.com"> <img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/relaxing-cat.jpg" alt="A cute orange cat lying on its back."> <!-- anchor element around the image links image to cat photos website. element adds image. alt attribute describes the image -->
      </a>
      </section>  
      <section> <!-- defines a section of the webpage -->
        <h2>Cat Lists</h2>
        <h3>Things cats love:</h3>
        <ul> <!-- unordered list element creates a bulleted list -->
          <li>catnip</li>
          <li>laser pointers</li>
          <li>lasagna</li>
        </ul>
        <figure> <!-- figure element groups an image with a caption -->
        <img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/lasagna.jpg" alt="A slice of lasagna on a plate.">
        <figcaption>Cats <em>love</em> lasagna.</figcaption> <!-- caption element provides a description for the image. em places emphasises on text -->
        </figure>
        <h3>Top 3 things cats hate:</h3>
        <ol>
          <li>flea treatment</li>
          <li>thunder</li>
          <li>other cats</li>
        </ol>
        <figure>
          <img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/cats.jpg" alt="Two tabby kittens sleeping together on a couch.">
          <figcaption>Cats <strong>hate</strong> other cats.</figcaption>  
        </figure>
      </section>
    </main>
    <footer> <!-- defines footer for a webpage or section which usually contains info about the author of the webpage, copyright data, links to terms of use, contact information, and more. -->
      <p>
        No Copyright - <a href="https://www.freecodecamp.org">freeCodeCamp.org</a>
      </p>
    </footer>
  </body>
</html>
