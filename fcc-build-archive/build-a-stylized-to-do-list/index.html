<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link href="styles.css" rel="stylesheet">
    <title>Styled To-Do List</title>
</head>
<body>
    <ul class="todo-list">
        <li>
            <input type="checkbox" id="item1">
            <label for="item1">First Item</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://example.org/one" target="_blank">First Link</a></li>
            </ul>
        </li>
        
        <li>
            <input type="checkbox" id="item2">
            <label for="item2">Second Item</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://example.org/two" target="_blank">Second Link</a></li>
            </ul>
        </li>
        
        <li>
            <input type="checkbox" id="item3">
            <label for="item3">Third Item</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://example.org/three" target="_blank">Third Link</a></li>
            </ul>
        </li>
        
        <li>
            <input type="checkbox" id="item4">
            <label for="item4">Fourth Item</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://example.org/four" target="_blank">Fourth Link</a></li>
            </ul>
        </li>
    </ul>
</body>
</html>
