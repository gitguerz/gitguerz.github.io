<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting Card</title>
    <link href="styles.css" rel="stylesheet">
  </head>
  <body>
    <div class="card" id="greeting-card">
      <h1>Happy Birthday!</h1>
      <p class="message">
        Wishing you all the happiness and joy on your special day!
      </p>
      <div class="card-links">
        <a href="#send" class="send-link">Send Card</a> <!-- This is a link that will navigate to the "send" section of the page -->
        <a href="#share" class="share-link">Share on Social Media</a> <!-- This is a link that will navigate to the "share" section of the page -->
      </div>
    </div>
    <section id="send"> <!-- This is a section with the id "send" that will be navigated to when the "Send Card" link is clicked -->
      <h2>Sending your card...</h2>
      <p>Card successfully sent to your recipient!</p>
    </section>
    <section id="share"> <!-- This is a section with the id "share" that will be navigated to when the "Share on Social Media" link is clicked -->
      <h2>Sharing your card...</h2>
      <p>Your card was shared on social media!</p>
    </section>
  </body>
</html>
