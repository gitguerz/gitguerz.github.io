<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HTML Audio and Video Lab</title>
</head>
<body>
  <h1>My Favorite Video and Song</h1> <!-- h1 element defines the main heading of the page. -->
  <section> <!-- section element groups related content together. -->
    <h2>Learning to Code</h2> <!-- h2 element defines a subheading for the section. -->
    <video controls width="640"> <!-- video element adds a video player to your webpage. controls attribute adds play, pause, and volume controls. width attribute sets the width of the video player. -->
      <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4"> <!-- source element specifies the video file and its format. src attribute specifies the path to the video file. type attribute specifies the format of the video file. video/mp4 value is the format for MP4 videos. -->
    </video>
  </section>
  <section>
    <h2>Sailing Away</h2>
    <audio controls loop src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3"></audio> <!-- audio element adds an audio player to your webpage. controls attribute adds play, pause, and volume controls. loop attribute makes the audio play in a loop. src attribute specifies the path to the audio file. -->
  </section>
</body>
</html>
