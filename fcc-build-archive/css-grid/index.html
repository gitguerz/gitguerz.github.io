<!DOCTYPE html>                         <!-- tells the browser this is HTML5 -->
<html lang="en">                        <!-- root element, lang helps accessibility/SEO -->
<head>                                   <!-- metadata, not visible on page -->
  <meta charset="UTF-8">                <!-- sets character encoding -->
  <link rel="stylesheet" href="styles.css">  <!-- connects this file to your CSS -->
</head>
<body>                                   <!-- everything visible goes here -->
  <div class="container">               <!-- the GRID CONTAINER — matches display:grid in CSS -->
    <div class="header">Header</div>    <!-- grid item, spans full width row 1 -->
    <div class="sidebar">Sidebar</div>  <!-- grid item, column 1 row 2 -->
    <div class="main">Main</div>        <!-- grid item, column 2 row 2 -->
    <div class="aside">Aside</div>      <!-- grid item, column 3 row 2 -->
    <div class="footer">Footer</div>    <!-- grid item, spans full width row 3 -->
  </div>
</body>
</html>
