<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pseudo-class Playground</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <p>First element: first paragraph</p>
    <div>Second element: first div — matched by :nth-child(2)</div>
    <span>Third element: span</span>
    <p>Fourth element: second paragraph — matched by p:nth-of-type(2)</p>
    <div>Fifth element: second div</div>
  </main>
</body>
</html>
