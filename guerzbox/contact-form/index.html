<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main><!-- contains the page's primary content -->
    <h1>Contact Form</h1> <!-- tells users and screen readers the main purpose of the page -->

    <form action="#" method="post"> <!-- specifies where the form data is sent and how it is submitted -->

      <label for="full-name">Full Name</label> <!-- provides an accessible text label for the input below -->
      <input
        type="text"
        id="full-name"
        name="full-name"
        placeholder="Enter your full name"
        required>

      <label for="email">Email</label> <!-- provides an accessible text label for the email input below -->
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        required>

      <label for="message">Message</label> <!-- provides an accessible text label for the message field below -->
      <textarea
        id="message"
        name="message"
        placeholder="Enter your message"
        required></textarea> <!-- creates a multi-line text field for longer user input -->

      <button type="submit">Send Message</button> <!-- submits the form after all validation requirements have been met -->

    </form>

  </main>
</body>
</html>
