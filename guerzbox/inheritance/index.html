<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inheritance Playground</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <article class="card">
      <h1>Inheritance Playground</h1>
      <p>The card's color and font are inherited by this paragraph, but <strong>this strong text resets its color.</strong></p>
      <button type="button">Inherited button color</button>
    </article>
  </body>
</html>
