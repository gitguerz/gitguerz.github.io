name = "guerzbook"
main = "guerzbook-worker.js"
compatibility_date = "2026-08-01"

# Create the namespace in the dashboard (Storage & Databases -> KV), then paste its id here.
[[kv_namespaces]]
binding = "GUESTBOOK"
id = "PASTE_KV_NAMESPACE_ID"

[vars]
ALLOWED_ORIGINS = "https://guerz.lol,https://www.guerz.lol"
REQUIRE_APPROVAL = "false"
# ADMIN_TOKEN is a secret — set it in the dashboard, not here.
